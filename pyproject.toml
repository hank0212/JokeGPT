[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jokegpt"
version = "0.1.0"
description = "A character-level GPT pre-trained on prose and fine-tuned to tell jokes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
tracking = ["comet_ml>=3.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/jokegpt"]

[tool.coverage.report]
fail_under = 80
show_missing = true
